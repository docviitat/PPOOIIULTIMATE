spring.application.name=Laboratorio4

server.port = 9001

# Configurar la coneccion a la base de datos
spring.datasource.url = jdbc:mariadb://localhost:3306/ppooii
spring.datasource.username = ppooii
spring.datasource.password = ppooii123
spring.datasource.driver-class-name=org.mariadb.jdbc.Driver
spring.jpa.database-platform=org.hibernate.dialect.MariaDBDialect
# Indica si debe mostrar el log de las consultas sql ejecutadas
# Bueno a la hora de depurar 
spring.jpa.show-sql= true

# Configurar Hibernate
spring.jpa.hibernate.ddl-auto= none
spring.data.jpa.repositories.enabled=true

#spring.main.allow-bean-definition-overriding=true
#spring.mvc.pathmatch.matching-strategy = ANT_PATH_MATCHER


# Carga de archivos Excel (multipart)
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# ===================== SWAGGER / OPENAPI (Laboratorio 4) =====================
# habilitar/deshabilitar api-docs - swagger-ui
springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true

# definir la ruta de swagger-ui (grafica) y de api-docs (json). Ambas sin token.
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/api-docs

# seleccionar los @RequestMapping que se visualizan en la documentacion
#springdoc.packagesToScan=com.PPOOII.Laboratorio.Controller
springdoc.pathsToMatch=/LaboratorioV1/**,/LaboratorioV2/**,/LaboratorioV3/**,/LaboratorioV4/**,/authenticate

# presentacion
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha
springdoc.swagger-ui.display-request-duration=true

### Aprende mas en https://springdoc.org/

# ===================== TAREAS PROGRAMADAS (Entrega 3) =====================
# Licencias vencidas -> RO (cada 2 min) | Documentos vencidos -> VENCIDO (cada 2 min) | Lat/Long con Google Maps (cada 90 s)
tareas.licencias.ms=120000
tareas.documentos.ms=120000
tareas.coordenadas.ms=90000

# ===================== GOOGLE MAPS (Entrega 3) =====================
# API Key de Google Maps Geocoding. Tambien puede definirse con la variable de entorno GOOGLE_MAPS_API_KEY.
# Si no hay clave se usa Nominatim (OpenStreetMap) como respaldo para desarrollo.
google.maps.api-key=${GOOGLE_MAPS_API_KEY:}
