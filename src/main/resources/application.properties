spring.application.name=Laboratorio4

server.port = 9001

# Configurar la coneccion a la base de datos
spring.datasource.url = ${DB_URL:jdbc:mariadb://localhost:3306/ppooii}
spring.datasource.username = ${DB_USER:ppooii}
spring.datasource.password = ${DB_PASSWORD:ppooii123}
# Indica si debe mostrar el log de las consultas sql ejecutadas
# Bueno a la hora de depurar 
spring.jpa.show-sql= true

# Configurar Hibernate
spring.jpa.hibernate.ddl-auto= none
spring.data.jpa.repositories.enabled=true

#spring.main.allow-bean-definition-overriding=true
#spring.mvc.pathmatch.matching-strategy = ANT_PATH_MATCHER


# Carga de archivos Excel (multipart)
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# ===================== SWAGGER / OPENAPI (Laboratorio 4) =====================
# habilitar/deshabilitar api-docs - swagger-ui
springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true

# definir la ruta de swagger-ui (grafica) y de api-docs (json). Ambas sin token.
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/api-docs

# seleccionar los @RequestMapping que se visualizan en la documentacion
# El filtro de rutas se define por grupo en OpenApiConfig.
springdoc.packages-to-scan=com.PPOOII.Laboratorio.Controller

# presentacion
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha
springdoc.swagger-ui.display-request-duration=true

### Aprende mas en https://springdoc.org/

# ===================== TAREAS PROGRAMADAS (Entrega 3) =====================
# Licencias vencidas -> RO (cada 2 min) | Documentos vencidos -> VENCIDO (cada 2 min) | Lat/Long con Nominatim / OpenStreetMap (cada 90 s)
tareas.licencias.ms=10000
tareas.documentos.ms=10000
tareas.coordenadas.ms=10000

# Geocodificación gratuita: caché persistente y máximo 4 consultas/minuto.
geocoding.url=${GEOCODING_URL:https://nominatim.openstreetmap.org/search}
geocoding.user-agent=${GEOCODING_USER_AGENT:PPOOII-Laboratorio4/1.0 (proyecto academico)}
tareas.personas.enabled=false

# RabbitMQ: el consumidor puede detenerse sin detener el productor HTTP.
mensajeria.enabled=${MENSAJERIA_ENABLED:true}
mensajeria.cola=${RABBITMQ_QUEUE:ppooii.mensajes}
mensajeria.consumidor.enabled=${RABBITMQ_CONSUMER_ENABLED:true}
spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USER:guest}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:guest}
spring.rabbitmq.publisher-confirm-type=correlated
spring.rabbitmq.publisher-returns=true
spring.rabbitmq.template.mandatory=true
spring.rabbitmq.listener.simple.prefetch=1
spring.jpa.open-in-view=false

# Selector por entrega del proyecto y documentación compacta.
springdoc.swagger-ui.urls-primary-name=00-todos
springdoc.swagger-ui.doc-expansion=none
springdoc.swagger-ui.filter=true
springdoc.swagger-ui.default-models-expand-depth=-1
